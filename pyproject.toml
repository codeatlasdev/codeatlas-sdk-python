[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeatlas"
version = "0.1.0"
description = "Typed Python client for the public CodeAtlas API (https://codeatlas.com.br/api/v1)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "CodeAtlas", email = "contato@codeatlas.com.br" }]
keywords = ["codeatlas", "sdk", "api-client"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://codeatlas.com.br"
Documentation = "https://codeatlas.com.br/docs"
Repository = "https://github.com/codeatlasdev/codeatlas-sdk-python"
Issues = "https://github.com/codeatlasdev/codeatlas-sdk-python/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/codeatlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
